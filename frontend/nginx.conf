# Modèle nginx : ${PORT}, ${BACKEND_URL} et ${ASSISTANT_URL} sont remplacés au démarrage par les variables d'environnement.
# En local (docker compose) les valeurs par défaut du Dockerfile suffisent.
# Sur Railway : PORT est fourni par Railway ; BACKEND_URL et ASSISTANT_URL sont à définir sur le service frontend
# (sans « / » final, par exemple http://backend.railway.internal:8080).
#
# Les adresses sont dans des variables nginx et le résolveur DNS est rappelé toutes les 10 s : si un service est
# redéployé et change d'adresse, nginx la retrouve tout seul au lieu de garder l'ancienne.
server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  set $backend_url ${BACKEND_URL};
  set $assistant_url ${ASSISTANT_URL};

  # L'API est relayée vers le serveur Spring Boot
  location /api/ {
    proxy_pass $backend_url;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # L'assistant est un service à part : il ne voit pas la base. Le préfixe /assistant est retiré avant l'appel.
  location /assistant/ {
    rewrite ^/assistant/(.*)$ /$1 break;
    proxy_pass $assistant_url;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Le service worker ne doit jamais rester en cache : une nouvelle version doit passer tout de suite
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Application monopage : toute autre adresse renvoie index.html
  location / {
    try_files $uri /index.html;
  }
}
