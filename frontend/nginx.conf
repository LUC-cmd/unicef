# Modèle nginx : ${PORT}, ${BACKEND_URL} et ${ASSISTANT_URL} sont remplacés au démarrage par les variables d'environnement.
# En local (docker compose) : PORT=80 et BACKEND_URL=http://backend:8080 (valeurs par défaut du Dockerfile).
# ASSISTANT_URL se termine par « / » : il retire le préfixe /assistant/ avant d'appeler le service.
# Sur Railway : PORT est fourni par Railway, BACKEND_URL est à définir sur le service frontend.
server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;

  # L'API est relayée vers le serveur Spring Boot
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # L'assistant est un service à part : il ne voit pas la base
  location /assistant/ {
    proxy_pass ${ASSISTANT_URL};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Application monopage : toute autre adresse renvoie index.html
  location / {
    try_files $uri /index.html;
  }
}
