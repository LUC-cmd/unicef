spring:
  application:
    name: fildor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fildor}
    username: ${DB_USER:fildor}
    password: ${DB_PASSWORD:fildor}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

fildor:
  # Poivre ajouté avant le hash SHA-256 des numéros de téléphone. EN PRODUCTION : secret propre, jamais dans le dépôt.
  telephone-pepper: ${FILDOR_PEPPER:fildor-demo-pepper}
  # Crée les comptes de démonstration au premier démarrage. À mettre à false hors démonstration.
  comptes-demo: ${FILDOR_COMPTES_DEMO:true}
  mot-de-passe-demo: ${FILDOR_MDP_DEMO:FilDor2026!demo}
  # Origines autorisées pour le front (le proxy de Vite évite CORS en développement)
  origines-autorisees: ${FILDOR_ORIGINES:http://localhost:5173,http://localhost:8081}
  # En dessous de ce nombre de familles, une zone n'est pas détaillée sur la carte (anonymat)
  seuil-anonymat: 5
  # Cycle quotidien des rappels (06h00). Désactivable pour les tests.
  cycle-rappels-actif: ${FILDOR_CYCLE_ACTIF:true}
  # Clé de signature des QR du carnet (Ed25519 en PKCS#8, Base64). Clé de démonstration ci-dessous ;
  # EN PRODUCTION : secret propre via FILDOR_CLE_QR, sinon une clé éphémère est générée à chaque démarrage.
  cle-qr: ${FILDOR_CLE_QR:MC4CAQAwBQYDK2VwBCIEID5zk8lvYCyCguMn80FeKIQ60o4vef2hZCw011z4NJa+}
